services:
  samba-dc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lalilulelo_ad
    network_mode: "host"
    cap_add:
      - SYS_ADMIN
    environment:
      - REALM=LALILULELO.LOCAL
      - DOMAIN=LALILULELO
      - ADMIN_PASSWORD=datemi30!
    dns:
      - 127.0.0.1
    dns_search:
      - LALILULELO.LOCAL
    volumes:
      # Volumi nominali per salvare i dati di Active Directory e la configurazione
      - samba-etc:/etc/samba
      - samba-var:/var/lib/samba
    restart: unless-stopped
  ldap-ui:
    image: dnknth/ldap-ui:latest
    container_name: samba-ad-webui
    ports:
      - "8080:8080"
    environment:
      # Modifica con l'IP del tuo server Samba Active Directory
      - LDAP_URL=ldap://192.168.1.201:389
      # La base del tuo dominio AD (es: dc=azienda,dc=locale)
      - LDAP_BASE_DN=dc=lalilulelo,dc=local
      # Eventuale utente amministratore per il bind iniziale (opzionale, la UI richiede comunque il login)
      - LDAP_BIND_DN=cn=Administrator,cn=Users,dc=lalilulelo,dc=local
    restart: unless-stopped


volumes:
  samba-etc:
  samba-var:

