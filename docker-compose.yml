services:
  samba-dc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lalilulelo_ad
    network_mode: "host"
    cap_add:
      - SYS_ADMIN
    environment:
      - REALM=LALILULELO.LOCAL
      - DOMAIN=LALILULELO
      - ADMIN_PASSWORD=datemi30!
    dns:
      - 127.0.0.1
    dns_search:
      - LALILULELO.LOCAL
    volumes:
      # Volumi nominali per salvare i dati di Active Directory e la configurazione
      - samba-etc:/etc/samba
      - samba-var:/var/lib/samba
    restart: unless-stopped
  ldap-ui:
    image: osixia/phpldapadmin:latest
    container_name: samba-ad-webui
    ports:
      - "8080:80"
    environment:
      # Modificato in ldaps:// per soddisfare il requisito "strong authentication"
      - PHPLDAPADMIN_LDAP_HOSTS=ldaps://192.168.1.201
      - PHPLDAPADMIN_HTTPS=false
      - PHPLDAPADMIN_LDAP_CLIENT_TLS=true
      - PHPLDAPADMIN_LDAP_CLIENT_TLS_REQCERT=never
    restart: unless-stopped

  mailserver:
    # Nota: docker/mailserver è stato rinominato in mailserver/docker-mailserver
    image: mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.lalilulelo.local
    domainname: lalilulelo.local
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - maillogs:/var/log/mail
      - mailconfig:/tmp/docker-mailserver
      - ./ldap.conf:/etc/ldap/ldap.conf:ro
    environment:
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      # Configurazione LDAP base per Active Directory
      - ACCOUNT_PROVISIONER=LDAP
      - LDAP_SERVER_HOST=ldaps://192.168.1.201:636
      - LDAP_SEARCH_BASE=DC=LALILULELO,DC=LOCAL
      - LDAP_BIND_DN=CN=Administrator,CN=Users,DC=LALILULELO,DC=LOCAL
      - LDAP_BIND_PW=datemi30!
      - LDAP_QUERY_FILTER_USER=(userPrincipalName=%s)
      - LDAP_QUERY_FILTER_GROUP=(member=%s)
      - LDAP_QUERY_FILTER_ALIAS=(proxyAddresses=smtp:%s)
      - DOVECOT_PASS_FILTER=(userPrincipalName=%u)
      - DOVECOT_USER_FILTER=(userPrincipalName=%u)
      - DOVECOT_AUTH_BIND=yes
    restart: unless-stopped

  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    ports:
      - "8081:80"
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=mailserver
      - ROUNDCUBEMAIL_SMTP_SERVER=mailserver
    depends_on:
      - mailserver
    restart: unless-stopped

volumes:
  samba-etc:
  samba-var:
  maildata:
  mailstate:
  maillogs:
  mailconfig:
