services:
  samba-dc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lalilulelo_ad
    network_mode: "host"
    cap_add:
      - SYS_ADMIN
    environment:
      - REALM=LALILULELO.LOCAL
      - DOMAIN=LALILULELO
      - ADMIN_PASSWORD=datemi30!
    dns:
      - 127.0.0.1
    dns_search:
      - LALILULELO.LOCAL
    volumes:
      # Volumi nominali per salvare i dati di Active Directory e la configurazione
      - samba-etc:/etc/samba
      - samba-var:/var/lib/samba
    restart: unless-stopped
  ldap-ui:
    image: dnknth/ldap-ui:latest
    container_name: samba-ad-webui
    ports:
      - "8080:5000"
    environment:
      # Modifica con l'IP del tuo server Samba Active Directory
      - LDAP_URL=ldap://192.168.1.201:389
      # La base del tuo dominio AD (es: dc=azienda,dc=locale)
      - BASE_DN=dc=lalilulelo,dc=local
      # Per Active Directory serve specificare anche dove si trova lo schema
      - SCHEMA_DN=cn=Schema,cn=Configuration,dc=lalilulelo,dc=local
      # Variabili fondamentali per non fare check anonimi e usare attributi di Windows/Samba
      - BIND_AS_USER=true
      - BIND_PATTERN=cn=%s,cn=Users,dc=lalilulelo,dc=local
      - LOGIN_ATTR=cn
    restart: unless-stopped


volumes:
  samba-etc:
  samba-var:

